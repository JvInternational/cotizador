<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotizador de Prendas</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#17212b;--muted:#6b7280;--line:#e5e7eb;--accent:#0f6fb2;--accent2:#0b5d94;--ok:#168a55;--danger:#c0392b;--shadow:0 8px 28px rgba(16,24,40,.08)}*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui;background:var(--bg);color:var(--ink);line-height:1.5}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.app{display:flex;min-height:100vh}.side{width:240px;background:#f8f9fa;border-right:1px solid var(--line);padding:24px 20px;overflow-y:auto}.brand{font-size:22px;font-weight:700;margin-bottom:4px;color:var(--ink)}.sub{font-size:12px;color:var(--muted);margin-bottom:24px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{background:0;border:0;padding:12px 16px;text-align:left;cursor:pointer;border-radius:8px;font-size:14px;color:var(--ink);transition:all .2s}.nav button:hover{background:rgba(15,111,178,.05)}.nav button.active{background:var(--accent);color:#fff;font-weight:600}.main{flex:1;display:flex;flex-direction:column}.top{background:#fff;border-bottom:1px solid var(--line);padding:20px 24px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:28px}.top .actions{display:flex;gap:12px}.top button{padding:10px 16px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-weight:500;transition:all .2s}.top button:hover{background:#f9f9f9;border-color:var(--accent)}.top button.primary{background:var(--accent);color:#fff;border:0}.content{flex:1;padding:24px;overflow-y:auto}.view{display:none}.view.active{display:block}.section-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}.card{background:var(--panel);padding:20px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow)}.card .label{font-size:12px;color:var(--muted);margin-bottom:8px}.card .value{font-size:32px;font-weight:700;color:var(--accent)}.form{display:flex;flex-direction:column;gap:16px;max-width:600px}.field{display:flex;flex-direction:column}.field label{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,111,178,.1)}.field textarea{resize:vertical;min-height:100px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid2 .panel:first-child{grid-column:1}.panel{background:var(--panel);padding:24px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow)}.panel h2{margin:0 0 16px;font-size:20px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{text-align:left;padding:12px;background:#f5f5f5;border-bottom:2px solid var(--line);font-weight:600;color:var(--ink)}.table td{padding:12px;border-bottom:1px solid var(--line)}.table tr:hover{background:rgba(15,111,178,.02)}.button{padding:10px 16px;background:var(--accent);color:#fff;border:0;border-radius:6px;cursor:pointer;font-weight:600;transition:all .2s;display:inline-block}.button:hover{background:var(--accent2)}.button.secondary{background:#f5f5f5;color:var(--ink);border:1px solid var(--line)}.button.danger{background:var(--danger)}.button.danger:hover{background:#a93226}.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:16px 20px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000}.toast.show{opacity:1;pointer-events:auto}.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.result-row-bold{font-weight:600;color:var(--ink)}.calc-result{font-size:32px;font-weight:700;color:var(--ok);text-align:right;margin:16px 0;padding:16px;background:rgba(22,138,85,.05);border-radius:8px}.print-only{display:none}
@page{size:Letter portrait;margin:0.35in}
@media print{.side,.top .actions,.toolbar,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.panel{box-shadow:none;border:0}.print-only{display:block!important}body{background:#fff}}</style></head><body><div class="app"><aside class="side"><div class="brand">COTIZADOR</div><div class="sub">Sistema de cotización de prendas</div><div class="nav"><button data-view="dashboard" class="nav-btn active">📊 Dashboard</button><button data-view="new" class="nav-btn">✎ Nueva Cotización</button><button data-view="history" class="nav-btn">📋 Historial</button><button data-view="clients" class="nav-btn">👥 Clientes</button><button data-view="base" class="nav-btn">📦 Base de Costos</button><button data-view="settings" class="nav-btn">⚙️ Configuración</button></div></aside><main class="main"><div class="top"><h1 id="topTitle">Dashboard</h1><div class="actions"><button class="button secondary" onclick="exportData()">Exportar</button><button class="button secondary" onclick="importData()">Importar</button></div></div><div class="content">
<section id="dashboard" class="view active"><div class="cards"><div class="card"><div class="label">Cotizaciones guardadas</div><div class="value" id="kQuotes">0</div></div><div class="card"><div class="label">Clientes registrados</div><div class="value" id="kClients">0</div></div><div class="card"><div class="label">Última cotización</div><div class="value" id="kLast">-</div></div></div></section>
<section id="new" class="view"><div class="grid2"><div class="panel"><div class="section-title">Datos de cotización</div><div class="form"><div class="field"><label>Cliente</label><input id="qClient" list="clientList"></div><datalist id="clientList"></datalist><div class="field"><label>Tela</label><select id="qFabric"><option>Seleccionar...</option></select></div><div class="field"><label>Color</label><select id="qColor"><option>Seleccionar...</option></select></div><div class="field"><label>Cantidad (pcs)</label><input id="qQty" type="number" value="1000" min="1"></div><div class="field"><label>Pcs por kg</label><input id="qPcsKg" type="number" value="7.5" min="0.1" step="0.1"></div><div class="field"><label>Factor (fx)</label><input id="qFx" type="number" value="1" min="0.1" step="0.1"></div><div class="field"><label>Logística</label><input id="qLogx" type="number" step="0.01"></div><div class="field"><label>Fecha</label><input id="qDate" type="date"></div><div class="field"><label>Notas</label><textarea id="qNotes"></textarea></div><div class="field"><label>Fotos</label><input id="qPhotos" type="file" multiple accept="image/*" onchange="handlePhotos(event)"><div id="photoPreview" style="color:var(--muted);font-size:12px;margin-top:6px">Sin fotos seleccionadas.</div></div><button class="button" onclick="saveQuote()" style="margin-top:12px">Guardar cotización</button></div></div><div class="panel"><div class="section-title">Cálculo</div><div id="calcPanel" style="display:none"></div><div id="calcResult"></div></div></div></section>
<section id="history" class="view"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Historial de cotizaciones</h2><input id="historySearch" type="text" placeholder="Buscar..." style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;flex:0 1 200px" onkeyup="renderHistory()"></div><div id="historyTable"></div></div></section>
<section id="clients" class="view"><div class="panel"><h2>Clientes</h2><div class="form"><div class="field"><label>Nombre del cliente</label><input id="cName"></div><div class="field"><label>Contacto</label><input id="cContact"></div><button class="button" onclick="addClient()" style="margin-top:12px">Agregar cliente</button></div><div id="clientsTable" style="margin-top:24px"></div></div></section>
<section id="base" class="view"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>Base de costos</h2><div style="color:var(--muted);font-size:14px">Telas y colores disponibles</div></div><button class="button" onclick="addBase()">+ Agregar tela</button></div><div id="baseTable" style="margin-top:24px"></div></div></section>
<section id="settings" class="view"><div class="panel"><h2>Configuración de márgenes</h2><div class="form"><div class="field"><label>Merma (%)</label><input id="sWaste" type="number" step="0.1" value="2"></div><div class="field"><label>Comisión (%)</label><input id="sComm" type="number" step="0.1" value="5"></div><div class="field"><label>Utilidad (%)</label><input id="sProfit" type="number" step="0.1" value="25"></div><button class="button" onclick="saveSettings()" style="margin-top:12px">Guardar configuración</button></div></div></section>
</div></main></div><div id="printArea" class="print-only"></div><div id="toast" class="toast"></div>
<script>const INITIAL={"base":[{"name":"24/1 OE 100%","colors":{"PFD":{"hilo":56.5,"tejido":8.5,"acabado":19},"BLANCO":{"hilo":56.5,"tejido":8.5,"acabado":22},"CLARO":{"hilo":56.5,"tejido":8.5,"acabado":20},"OSCURO":{"hilo":56.5,"tejido":8.5,"acabado":25},"NEGRO":{"hilo":56.5,"tejido":8.5,"acabado":32}}},{"name":"20/1 OE 100%","colors":{"PFD":{"hilo":68.5,"tejido":10,"acabado":22},"BLANCO":{"hilo":68.5,"tejido":10,"acabado":26},"CLARO":{"hilo":68.5,"tejido":10,"acabado":24},"OSCURO":{"hilo":68.5,"tejido":10,"acabado":28},"NEGRO":{"hilo":68.5,"tejido":10,"acabado":36}}},{"name":"Piquet","colors":{"BLANCO":{"hilo":42,"tejido":15,"acabado":20},"COLORS":{"hilo":42,"tejido":15,"acabado":25}}}]};let state={quotes:[],clients:[],base:INITIAL.base,settings:{waste:2,comm:5,profit:25}};let quotePhotos=[];function init(){loadState();setDefaultDate();document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');showView(b.dataset.view)});fillFabric();document.getElementById('qFabric').onchange=fillColors;['qFabric','qColor','qPcsKg','qFx','qLogx','qQty'].forEach(id=>document.getElementById(id).onchange=calc);document.getElementById('qDate').valueAsDate=new Date();fillColors();renderDashboard();updateClientList();renderHistory();renderClients();renderBase();applySettings();loadSettings();document.getElementById('topTitle').textContent='Dashboard'}function loadState(){const saved=localStorage.getItem('cotizador_state');if(saved){try{state=JSON.parse(saved)}catch(e){console.error('Error:',e)}}}function saveState(){localStorage.setItem('cotizador_state',JSON.stringify(state))}function setDefaultDate(){document.getElementById('qDate').valueAsDate=new Date()}function handlePhotos(e){const files=Array.from(e.target.files||[]);Promise.all(files.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)}))).then(imgs=>{quotePhotos=imgs;renderPhotoPreview()})}function renderPhotoPreview(){const p=document.getElementById('photoPreview');if(p)p.textContent=quotePhotos.length?`${quotePhotos.length} foto(s) seleccionada(s).`:'Sin fotos seleccionadas.'}function num(v){return parseFloat(v)||0}function money(v){return'$'+v.toFixed(2)}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function calc(){const x=getCalc();if(!x.f){document.getElementById('calcResult').innerHTML='<p style="color:var(--danger)">Selecciona una tela y color</p>';return}const html=`<div class="result-row"><span>Costo tela/pc:</span><span class="result-row-bold">${money(x.fabricPc)}</span></div><div class="result-row"><span>Thread:</span><span class="result-row-bold">${money(x.thread)}</span></div><div class="result-row"><span>Print:</span><span class="result-row-bold">${money(x.print)}</span></div><div class="result-row"><span>Dye:</span><span class="result-row-bold">${money(x.dye)}</span></div><div class="result-row"><span>Overhead/C&S:</span><span class="result-row-bold">${money(x.oh)}</span></div><div class="result-row"><span>Trims:</span><span class="result-row-bold">${money(x.trims)}</span></div><div class="result-row"><span>Comisión:</span><span class="result-row-bold">${money(x.comm)}</span></div><div class="result-row result-row-bold"><span>Costo total/pc:</span><span>${money(x.cost)}</span></div><div class="result-row" style="background:var(--ok);color:#fff;margin:12px -12px 0"><span>Utilidad:</span><span>${money(x.profit)}</span></div><div class="calc-result">${money(x.grand)}</div><div class="result-row"><span>Total:</span><span>${money(x.total)}</span></div>`;document.getElementById('calcResult').innerHTML=html}function getCalc(){const pcsKg=num(document.getElementById('qPcsKg').value),fx=num(document.getElementById('qFx').value),qty=num(document.getElementById('qQty').value),logx=num(document.getElementById('qLogx').value);const fabricId=document.getElementById('qFabric').value,colorKey=document.getElementById('qColor').value,f=state.base.find(x=>x.name===fabricId),c=f?.colors?.[colorKey];if(!f||!c)return{f:null};const kg=qty/pcsKg;const thread=(c.hilo||0)*fx*kg;const fabric=(c.tejido||0)*fx*kg;const dye=(c.acabado||0)*fx*kg;const print=0;const oh=0;const trims=0.15;const waste=state.settings.waste||2;const comm=(state.settings.comm||5)/100;const profit=(state.settings.profit||25)/100;const fabricPc=fabric/qty;const cost=fabricPc+thread/qty+dye/qty+print+oh+trims;const commAmount=cost*comm;const profitAmount=(cost+commAmount)/(1-profit)*profit;const grand=cost+commAmount+profitAmount;return{f,fabric,thread,dye,fabricPc,print,oh,trims,waste,comm:commAmount,profit:profitAmount,cost,grand,qty,total:grand*qty,color:colorKey}}function fillFabric(){const sel=document.getElementById('qFabric');sel.innerHTML='<option>Seleccionar...</option>';state.base.forEach(f=>{sel.innerHTML+=`<option value="${f.name}">${f.name}</option>`})}function fillColors(){const fabricId=document.getElementById('qFabric').value,f=state.base.find(x=>x.name===fabricId);const sel=document.getElementById('qColor');sel.innerHTML='<option>Seleccionar...</option>';if(f)Object.keys(f.colors).forEach(c=>{sel.innerHTML+=`<option value="${c}">${c}</option>`})}function nextFolio(){const n=state.quotes.length+1;return 'COT-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0')}function saveQuote(){const x=getCalc();if(!x.f){toast('Selecciona una tela y color');return}const q={id:crypto.randomUUID(),folio:nextFolio(),client:document.getElementById('qClient').value||'Público general',date:document.getElementById('qDate').value,fabric:document.getElementById('qFabric').value,color:document.getElementById('qColor').value,qty:x.qty,pcsKg:num(document.getElementById('qPcsKg').value),fx:num(document.getElementById('qFx').value),logx:num(document.getElementById('qLogx').value),notes:document.getElementById('qNotes').value,photos:quotePhotos,calc:x,createdAt:new Date().toISOString()};state.quotes.push(q);saveState();toast('Cotización guardada ✓');resetQuote();renderDashboard();renderHistory()}function resetQuote(){document.getElementById('qClient').value='';document.getElementById('qQty').value=1000;document.getElementById('qNotes').value='';document.getElementById('qPcsKg').value=7.5;document.getElementById('qFx').value=1;document.getElementById('qLogx').value='';quotePhotos=[];document.getElementById('qPhotos').value='';renderPhotoPreview();setDefaultDate();fillColors();document.getElementById('calcResult').innerHTML=''}function doPrint(){const x=getCalc(),client=document.getElementById('qClient').value||'Público general',folio=document.getElementById('resultRef')?.textContent||nextFolio(),date=document.getElementById('qDate').value;const photosHtml=quotePhotos.length?`<div style="margin-top:8px"><b>Fotos:</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">${quotePhotos.map(p=>`<img src="${p}" style="width:80px;height:80px;object-fit:cover;border-radius:4px">`).join('')}</div></div>`:'';document.getElementById('printArea').innerHTML=`<div style="font-size:10px;line-height:1.2"><h1 style="margin:0 0 3px;font-size:21px">COTIZACIÓN</h1><div style="color:#666">${folio} · ${date}</div><hr style="margin:6px 0"><p style="margin:4px 0"><b>Cliente:</b> ${esc(client)}</p><p style="margin:4px 0"><b>Tela:</b> ${esc(x.f.name)} &nbsp; <b>Color:</b> ${esc(x.color)} &nbsp; <b>Cantidad:</b> ${x.qty.toLocaleString()}</p><table style="width:100%;border-collapse:collapse;font-size:10px"><tr><th style="text-align:left;border-bottom:1px solid #ccc;padding:4px">Concepto</th><th style="text-align:right;border-bottom:1px solid #ccc;padding:4px">USD/pc</th></tr>${[['Costo unitario tela',x.fabricPc],['Thread',x.thread],['Print',x.print],['Dye',x.dye],['Overhead / C&S',x.oh],['Trims',x.trims],['Comisión',x.comm],['Profit',x.profit]].map(r=>`<tr><td style="padding:4px">${r[0]}</td><td style="padding:4px;text-align:right">${money(r[1])}</td></tr>`).join('')}</table><h2 style="text-align:right;font-size:15px;margin:6px 0 1px">Precio unitario: ${money(x.grand)}</h2><h2 style="text-align:right;font-size:15px;margin:1px 0">Total: ${money(x.total)} USD</h2><p style="margin:5px 0">${esc(document.getElementById('qNotes').value)}</p>${photosHtml}</div>`;window.print()}function renderDashboard(){document.getElementById('kQuotes').textContent=state.quotes.length;document.getElementById('kClients').textContent=state.clients.length;document.getElementById('kLast').textContent=state.quotes.length>0?state.quotes[state.quotes.length-1].folio:'-'}function renderHistory(){const term=(document.getElementById('historySearch')?.value||'').toLowerCase();const qs=state.quotes.filter(q=>(q.folio+' '+q.client).toLowerCase().includes(term));const html=qs.length?`<div class="table-wrap"><table class="table"><tr><th>Folio</th><th>Cliente</th><th>Tela</th><th>Color</th><th>Fecha</th><th>Acciones</th></tr>${qs.map(q=>`<tr><td>${q.folio}</td><td>${esc(q.client)}</td><td>${esc(q.fabric)}</td><td>${esc(q.color)}</td><td>${q.date}</td><td><button class="button secondary" onclick="loadQuote('${q.id}')">Cargar</button> <button class="button danger" onclick="delQuote('${q.id}')">Eliminar</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--muted)">No hay cotizaciones guardadas.</p>';document.getElementById('historyTable').innerHTML=html}function loadQuote(id){const q=state.quotes.find(x=>x.id===id);if(!q)return;showView('new');document.getElementById('qClient').value=q.client;document.getElementById('qDate').value=q.date;const f=state.base.find(x=>x.name===q.fabric);if(f)document.getElementById('qFabric').value=q.fabric;fillColors();document.getElementById('qColor').value=q.color;document.getElementById('qQty').value=q.qty;document.getElementById('qPcsKg').value=q.pcsKg;document.getElementById('qFx').value=q.fx;document.getElementById('qLogx').value=q.logx;document.getElementById('qNotes').value=q.notes;quotePhotos=q.photos||[];renderPhotoPreview();calc()}function delQuote(id){if(confirm('¿Eliminar esta cotización?')){state.quotes=state.quotes.filter(x=>x.id!==id);saveState();renderHistory();toast('Cotización eliminada')}}function addClient(){const name=document.getElementById('cName').value.trim();if(!name)return toast('Escribe el nombre del cliente');state.clients.push({id:crypto.randomUUID(),name,contact:document.getElementById('cContact').value});saveState();toast('Cliente agregado ✓');document.getElementById('cName').value='';document.getElementById('cContact').value='';updateClientList();renderClients()}function updateClientList(){const d=document.getElementById('clientList');if(d)d.innerHTML=state.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}function renderClients(){const html=state.clients.length?`<div class="table-wrap"><table class="table"><tr><th>Nombre</th><th>Contacto</th><th>Acciones</th></tr>${state.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.contact)}</td><td><button class="button danger" onclick="delClient('${c.id}')">Eliminar</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--muted)">No hay clientes registrados.</p>';document.getElementById('clientsTable').innerHTML=html}function delClient(id){if(confirm('¿Eliminar este cliente?')){state.clients=state.clients.filter(x=>x.id!==id);saveState();updateClientList();renderClients();toast('Cliente eliminado')}}function addBase(){const name=prompt('Nombre de la tela:');if(!name)return;state.base.push({name,colors:{}});saveState();fillFabric();toast('Tela agregada')}function renderBase(){const html=state.base.length?`<div class="table-wrap"><table class="table"><tr><th>Tela</th><th>Color</th><th>Hilo</th><th>Tejido</th><th>Acabado</th><th></th></tr>${state.base.map((f,idx)=>Object.keys(f.colors).map(c=>`<tr><td>${esc(f.name)}</td><td>${esc(c)}</td><td>${f.colors[c].hilo}</td><td>${f.colors[c].tejido}</td><td>${f.colors[c].acabado}</td><td><button class="button secondary" onclick="editFabric(${idx},'${c}')">Editar</button> <button class="button danger" onclick="delFabric(${idx})">Eliminar</button></td></tr>`).join('')).join('')}</table></div>`:'<p style="color:var(--muted)">No hay telas configuradas.</p>';document.getElementById('baseTable').innerHTML=html}function editFabric(idx,colorName){const f=state.base[idx];if(!f)return;const hilo=prompt('Costo hilo:',f.colors[colorName]?.hilo||0);const tejido=prompt('Costo tejido:',f.colors[colorName]?.tejido||0);const acabado=prompt('Costo acabado:',f.colors[colorName]?.acabado||0);f.colors[colorName]={hilo:parseFloat(hilo)||0,tejido:parseFloat(tejido)||0,acabado:parseFloat(acabado)||0};saveState();fillColors();renderBase();toast('Tela actualizada')}function delFabric(idx){if(confirm('¿Eliminar esta tela?')){state.base.splice(idx,1);saveState();fillFabric();fillColors();renderBase();toast('Tela eliminada')}}function loadSettings(){document.getElementById('sWaste').value=state.settings.waste||2;document.getElementById('sComm').value=state.settings.comm||5;document.getElementById('sProfit').value=state.settings.profit||25}function saveSettings(){state.settings.waste=parseFloat(document.getElementById('sWaste').value)||2;state.settings.comm=parseFloat(document.getElementById('sComm').value)||5;state.settings.profit=parseFloat(document.getElementById('sProfit').value)||25;saveState();applySettings();toast('Configuración guardada ✓');calc()}function applySettings(){}function showView(view){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(view).classList.add('active');document.getElementById('topTitle').textContent=view.charAt(0).toUpperCase()+view.slice(1);if(view==='dashboard')renderDashboard();if(view==='history')renderHistory();if(view==='clients')renderClients();if(view==='base')renderBase()}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}function exportData(){const data=JSON.stringify(state,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`cotizador-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Datos exportados ✓')}function importData(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=evt=>{try{const imported=JSON.parse(evt.target.result);state=imported;saveState();location.reload();toast('Datos importados ✓')}catch(err){toast('Error al importar: '+err.message)}};reader.readAsText(file)};input.click()}window.addEventListener('load',init);</script></body></html>
