<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotizador de Prendas</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#17212b;--muted:#6b7280;--line:#e5e7eb;--accent:#0f6fb2;--accent2:#0b5d94;--ok:#168a55;--danger:#c0392b;--shadow:0 8px 28px rgba(16,24,40,.08)}*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;min-height:100vh}.app{display:flex;width:100%;flex:1}.side{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;overflow-y:auto;box-shadow:var(--shadow)}.brand{font-size:18px;font-weight:700;margin-bottom:4px}.sub{font-size:12px;color:var(--muted);margin-bottom:24px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{background:0;border:0;padding:10px 12px;border-radius:6px;color:var(--ink);cursor:pointer;font-size:14px;text-align:left;transition:all .2s}.nav button:hover{background:var(--bg)}.nav button.active{background:var(--accent);color:#fff}.main{flex:1;display:flex;flex-direction:column}.top{background:var(--panel);padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:20px}.actions{display:flex;gap:8px}.actions button{padding:8px 16px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s}.actions button:hover{background:var(--bg)}.actions button.primary{background:var(--accent);color:#fff;border:0}.content{flex:1;overflow-y:auto;padding:24px}.view{display:none}.view.active{display:block}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}.card{background:var(--panel);padding:20px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid var(--line)}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}.value{font-size:28px;font-weight:700;color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:24px}.section-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--ink)}.form{display:grid;gap:16px}.field{display:flex;flex-direction:column}.field label{font-size:13px;font-weight:500;margin-bottom:6px;color:var(--ink)}.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;transition:all .2s}.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,111,178,.1)}.field textarea{resize:vertical;min-height:80px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid2>.panel{margin-bottom:0}.calc-result{font-size:24px;font-weight:700;color:var(--ok);margin:16px 0}.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.result-row-bold{font-weight:600}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;padding:10px;background:var(--bg);font-weight:600;border-bottom:2px solid var(--line)}.table td{padding:10px;border-bottom:1px solid var(--line)}.table tr:hover{background:var(--bg)}.table .actions{justify-content:flex-start}.toast{display:none;position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:6px;font-size:13px;z-index:9999;animation:slideIn .3s}.toast.show{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:200px}.photo-preview{margin:12px 0;padding:12px;background:var(--bg);border-radius:6px;border:1px solid var(--line);font-size:13px}.photo-input{display:flex;gap:8px}.photo-input label{flex:1}.photo-input input{flex:1}@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}@media(max-width:768px){.grid2{grid-template-columns:1fr}.side{width:60px}.side .brand,.side .sub{display:none}.side .nav{gap:3px}.nav button{padding:10px 8px;font-size:12px}.actions{flex-direction:column}.top{flex-direction:column;align-items:stretch}.cards{grid-template-columns:1fr}}
.logo-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo-header img{height:50px}.no-print{display:block}
.print-only{display:none}
@page{size:Letter portrait;margin:0.35in}
@media print{
html,body{width:100%;height:auto!important;margin:0!important;padding:0!important;overflow:hidden!important}
body{font-size:10px!important;background:#fff!important}
.side,.top .actions,.toolbar,.no-print{display:none!important}
.main{margin:0!important;width:100%!important;padding:0!important}
.view{display:none!important}
#new{display:block!important}
#new>.grid2{display:block!important}
#new>.grid2>.panel:first-child{display:none!important}
#calcPanel{display:none!important}
.print-only{display:block!important;width:100%!important;margin:0!important;padding:0!important;box-shadow:none!important;border:0!important}
.panel{box-shadow:none!important;border:0!important}
#printArea{page-break-inside:avoid!important;break-inside:avoid!important}
img{page-break-inside:avoid!important;break-inside:avoid!important}
}</style></head><body><div class="app"><aside class="side"><div class="brand">COTIZADOR</div><div class="sub">Sistema de cotización de prendas</div><div class="nav"><button data-view="dashboard" class="nav-btn active">📊 Dashboard</button><button data-view="new" class="nav-btn">➕ Nueva</button><button data-view="history" class="nav-btn">📋 Historial</button><button data-view="clients" class="nav-btn">👥 Clientes</button><button data-view="base" class="nav-btn">💰 Base costos</button><button data-view="settings" class="nav-btn">⚙️ Configuración</button></div></aside><main class="main"><div class="top"><h1 id="topTitle">Dashboard</h1><div class="actions"><button class="primary" id="syncBtn" onclick="syncToCloud()">☁️ Sincronizar</button><button onclick="exportData()">📥 Exportar</button><button onclick="importData()">📤 Importar</button></div></div><div class="content"><section id="dashboard" class="view active"><div class="cards"><div class="card"><div class="label">Cotizaciones guardadas</div><div class="value" id="kQuotes">0</div></div><div class="card"><div class="label">Clientes registrados</div><div class="value" id="kClients">0</div></div><div class="card"><div class="label">Última cotización</div><div class="value" id="kLast">-</div></div></div></section><section id="new" class="view"><div class="grid2"><div class="panel"><div class="section-title">Datos de cotización</div><div class="form"><div class="field"><label>Cliente</label><input id="qClient" list="clientList"><datalist id="clientList"></datalist></div><div class="field"><label>Fecha</label><input id="qDate" type="date"></div><div class="field"><label>Tela</label><select id="qFabric" onchange="fillColors()"><option>Seleccionar...</option></select></div><div class="field"><label>Color</label><select id="qColor"><option>Seleccionar...</option></select></div><div class="field"><label>Estilo/Cuerpo</label><input id="qStyle" type="text" placeholder="Ej: Jersey, Polo, Piqué, T-Shirt"></div><div class="field"><label>Cantidad</label><input id="qQty" type="number" value="1000"></div><div class="field"><label>Pcs/kg</label><input id="qPcsKg" type="number" step="0.01" value="7.5"></div><div class="field"><label>Factor de costo (fx)</label><input id="qFx" type="number" step="0.01" value="1"></div><div class="field"><label>Logarítmo (opcional)</label><input id="qLogx" type="number" step="0.01"></div><div class="field"><label>Notas</label><textarea id="qNotes" placeholder="Observaciones adicionales..."></textarea></div><div class="photo-input"><label>Fotos:<input id="qPhotos" type="file" accept="image/*" multiple onchange="handlePhotos(event)" style="display:none"></label><button type="button" onclick="document.getElementById('qPhotos').click()" style="flex:0">📸 Seleccionar fotos</button></div><div id="photoPreview" class="photo-preview">Sin fotos seleccionadas.</div><div style="display:flex;gap:8px"><button class="primary" onclick="saveQuote()">✅ Guardar cotización</button><button onclick="resetQuote()">🔄 Limpiar</button></div></div></div><div class="panel" id="calcPanel"><div class="section-title">Precio calculado</div><div id="calcResult"></div><button class="primary" onclick="doPrint()">🖨️ Imprimir</button></div></div></section><section id="history" class="view"><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Historial de cotizaciones</h2><input id="historySearch" type="text" placeholder="Buscar por folio o cliente..." onkeyup="renderHistory()" style="flex:1;max-width:300px"></div><div id="historyTable"></div></div></section><section id="clients" class="view"><div class="panel"><h2>Clientes</h2><div class="form"><div class="field"><label>Nombre del cliente</label><input id="cName"></div><div class="field"><label>Contacto</label><input id="cContact"></div><div style="display:flex;gap:8px"><button class="primary" onclick="addClient()">Agregar cliente</button></div></div><div id="clientsTable"></div></div></section><section id="base" class="view"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>Base de costos</h2><div class="muted" style="font-size:12px">Precios unitarios en USD</div></div><button class="primary" onclick="addBase()">+ Nueva tela</button></div><div id="baseTable"></div></div></section><section id="settings" class="view"><div class="panel"><h2>Configuración de márgenes</h2><div class="form"><div class="field"><label>Merma</label><input id="sWaste" type="number" step="0.1"></div><div class="field"><label>Comisión (%)</label><input id="sComm" type="number" step="0.1"></div><div class="field"><label>Utilidad (%)</label><input id="sProfit" type="number" step="0.1"></div><div class="field"><label>URL Sincronización (opcional)</label><input id="sSyncUrl" type="text" placeholder="URL de servidor para sincronizar datos..."></div><div><button class="primary" onclick="saveSettings()">Guardar configuración</button></div></div></div></section></div></main></div><div id="toast" class="toast"></div><div id="printArea" style="display:none"></div><script>
const LOGO_URL='https://raw.githubusercontent.com/JvInternational/cotizador/main/logo.png';
const STORAGE_KEY='cotizador_state';
const SYNC_KEY='cotizador_sync_id';
let state={quotes:[],clients:[],base:[],settings:{waste:2,comm:5,profit:25}};
let quotePhotos=[];
function init(){
  loadState();
  setDefaultDate();
  document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    showView(b.dataset.view);
  });
  fillFabric();
  document.getElementById('qFabric').onchange=fillColors;
  ['qFabric','qColor','qStyle','qPcsKg','qFx','qLogx','qQty'].forEach(id=>document.getElementById(id).onchange=calc);
  document.getElementById('qDate').valueAsDate=new Date();
  fillFabric();
  fillColors();
  renderDashboard();
  updateClientList();
  renderHistory();
  renderClients();
  renderBase();
  applySettings();
  loadSettings();
  tryAutoSync();
}
function loadState(){
  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{state=JSON.parse(saved);} catch(e){console.error('Error loading state:',e);}
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function setDefaultDate(){
  document.getElementById('qDate').valueAsDate=new Date();
}
function handlePhotos(e){
  const files=Array.from(e.target.files||[]);
  Promise.all(files.map(f=>new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(f);
  }))).then(imgs=>{quotePhotos=imgs;renderPhotoPreview();});
}
function renderPhotoPreview(){
  const p=document.getElementById('photoPreview');
  if(p)p.textContent=quotePhotos.length?`${quotePhotos.length} foto(s) seleccionada(s).`:'Sin fotos seleccionadas.';
}
function num(v){return parseFloat(v)||0}
function money(v){return '$'+v.toFixed(2)}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function calc(){
  const x=getCalc();
  if(!x.f){document.getElementById('calcResult').innerHTML='<p style="color:var(--danger)">Selecciona una tela y color</p>';return}
  const html=`
    <div class="result-row"><span>Costo tela/pc:</span><span class="result-row-bold">${money(x.fabricPc)}</span></div>
    <div class="result-row"><span>Thread:</span><span class="result-row-bold">${money(x.thread)}</span></div>
    <div class="result-row"><span>Print:</span><span class="result-row-bold">${money(x.print)}</span></div>
    <div class="result-row"><span>Dye:</span><span class="result-row-bold">${money(x.dye)}</span></div>
    <div class="result-row"><span>Overhead/C&S:</span><span class="result-row-bold">${money(x.oh)}</span></div>
    <div class="result-row"><span>Trims:</span><span class="result-row-bold">${money(x.trims)}</span></div>
    <div class="result-row"><span>Comisión:</span><span class="result-row-bold">${money(x.comm)}</span></div>
    <div class="result-row result-row-bold"><span>Costo total/pc:</span><span>${money(x.cost)}</span></div>
    <div class="result-row" style="background:var(--ok);color:#fff;margin:12px -12px 0"><span>Utilidad:</span><span>${money(x.profit)}</span></div>
    <div class="calc-result">${money(x.grand)}</div>
    <div class="result-row"><span>Total:</span><span>${money(x.total)}</span></div>
  `;
  document.getElementById('calcResult').innerHTML=html;
}
function getCalc(){
  const pcsKg=num(document.getElementById('qPcsKg').value),
  fx=num(document.getElementById('qFx').value),
  qty=num(document.getElementById('qQty').value),
  logx=num(document.getElementById('qLogx').value);
  const fabricId=document.getElementById('qFabric').value,
  colorKey=document.getElementById('qColor').value,
  f=state.base.find(x=>x.name===fabricId),
  c=f?.colors?.[colorKey];
  if(!f||!c)return{f:null};
  const kg=qty/pcsKg;
  const thread=(c.hilo||0)*fx*kg;
  const fabric=(c.tejido||0)*fx*kg;
  const dye=(c.acabado||0)*fx*kg;
  const print=0;
  const oh=0;
  const trims=0.15;
  const waste=state.settings.waste||2;
  const comm=(state.settings.comm||5)/100;
  const profit=(state.settings.profit||25)/100;
  const fabricPc=fabric/qty;
  const cost=fabricPc+thread/qty+dye/qty+print+oh+trims;
  const commAmount=cost*comm;
  const profitAmount=(cost+commAmount)/(1-profit)*profit;
  const grand=cost+commAmount+profitAmount;
  return{f,fabric,thread,dye,fabricPc,print,oh,trims,waste,comm:commAmount,profit:profitAmount,cost,grand,qty,total:grand*qty,color:colorKey};
}
function fillFabric(){
  const sel=document.getElementById('qFabric');
  sel.innerHTML='<option>Seleccionar...</option>';
  state.base.forEach(f=>{sel.innerHTML+=`<option value="${f.name}">${f.name}</option>`});
}
function fillColors(){
  const fabricId=document.getElementById('qFabric').value,
  f=state.base.find(x=>x.name===fabricId);
  const sel=document.getElementById('qColor');
  sel.innerHTML='<option>Seleccionar...</option>';
  if(f)Object.keys(f.colors).forEach(c=>{sel.innerHTML+=`<option value="${c}">${c}</option>`});
}
function nextFolio(){
  const n=state.quotes.length+1;
  return 'COT-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0');
}
function saveQuote(){
  const x=getCalc();
  if(!x.f){toast('Selecciona una tela y color');return}
  const q={
    id:crypto.randomUUID(),
    folio:nextFolio(),
    client:document.getElementById('qClient').value||'Público general',
    date:document.getElementById('qDate').value,
    style:document.getElementById('qStyle').value,
    fabric:document.getElementById('qFabric').value,
    color:document.getElementById('qColor').value,
    qty:x.qty,
    pcsKg:num(document.getElementById('qPcsKg').value),
    fx:num(document.getElementById('qFx').value),
    logx:num(document.getElementById('qLogx').value),
    notes:document.getElementById('qNotes').value,
    photos:quotePhotos,
    calc:x,
    createdAt:new Date().toISOString()
  };
  state.quotes.push(q);
  saveState();
  toast('Cotización guardada ✓');
  resetQuote();
  renderDashboard();
  renderHistory();
}
function resetQuote(){
  document.getElementById('qClient').value='';
  document.getElementById('qStyle').value='';
  document.getElementById('qQty').value=1000;
  document.getElementById('qNotes').value='';
  document.getElementById('qPcsKg').value=7.5;
  document.getElementById('qFx').value=1;
  document.getElementById('qLogx').value='';
  quotePhotos=[];
  document.getElementById('qPhotos').value='';
  renderPhotoPreview();
  setDefaultDate();
  fillColors();
  document.getElementById('calcResult').innerHTML='';
}
function doPrint(){
  const x=getCalc(),
  client=document.getElementById('qClient').value||'Público general',
  folio=document.getElementById('resultRef')?.textContent||nextFolio(),
  date=document.getElementById('qDate').value,
  style=document.getElementById('qStyle').value;
  const photosHtml=quotePhotos.length?`<div style="margin-top:12px"><b>Fotos:</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${quotePhotos.map(p=>`<img src="${p}" style="width:90px;height:90px;object-fit:cover;border:1px solid #ccc;border-radius:4px">`).join('')}</div></div>`:'';
  document.getElementById('printArea').innerHTML=`<div style="font-size:11px;line-height:1.3">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;border-bottom:2px solid #333;padding-bottom:8px">
      <img src="${LOGO_URL}" style="height:45px;object-fit:contain" onerror="this.style.display='none'">
      <div>
        <h1 style="margin:0;font-size:18px;font-weight:700">COTIZACIÓN</h1>
        <p style="margin:2px 0;color:#666;font-size:9px">${folio} · ${date}</p>
      </div>
    </div>
    <p style="margin:6px 0"><b>Cliente:</b> ${esc(client)}</p>
    <p style="margin:6px 0"><b>Tela:</b> ${esc(x.f.name)} &nbsp; <b>Color:</b> ${esc(x.color)}${style?` &nbsp; <b>Estilo:</b> ${esc(style)}`:''}</p>
    <p style="margin:6px 0"><b>Cantidad:</b> ${x.qty.toLocaleString()} pcs</p>
    <table style="width:100%;border-collapse:collapse;font-size:10px;margin-top:8px">
      <tr><th style="text-align:left;border-bottom:2px solid #333;padding:6px;background:#f5f5f5">Concepto</th><th style="text-align:right;border-bottom:2px solid #333;padding:6px;background:#f5f5f5">USD/pc</th></tr>
      ${[['Costo unitario tela',x.fabricPc],['Thread',x.thread/x.qty],['Dye',x.dye/x.qty],['Print',x.print],['Overhead / C&S',x.oh],['Trims',x.trims],['Comisión',x.comm/x.qty]].map(r=>`<tr><td style="padding:6px;border-bottom:1px solid #ddd">${r[0]}</td><td style="padding:6px;border-bottom:1px solid #ddd;text-align:right">${money(r[1])}</td></tr>`).join('')}
      <tr style="background:#f5f5f5"><td style="padding:6px;font-weight:600;border-bottom:2px solid #333">SUBTOTAL</td><td style="padding:6px;text-align:right;font-weight:600;border-bottom:2px solid #333">${money(x.cost)}</td></tr>
      <tr style="background:#e8f5e9"><td style="padding:6px;font-weight:700">UTILIDAD</td><td style="padding:6px;text-align:right;font-weight:700">${money(x.profit/x.qty)}</td></tr>
      <tr style="background:#fff3e0"><td style="padding:8px;font-weight:700;font-size:12px">PRECIO UNITARIO</td><td style="padding:8px;text-align:right;font-weight:700;font-size:12px">${money(x.grand)}</td></tr>
      <tr style="background:#e3f2fd"><td style="padding:8px;font-weight:700;font-size:12px">TOTAL (${x.qty} pcs)</td><td style="padding:8px;text-align:right;font-weight:700;font-size:12px">${money(x.total)}</td></tr>
    </table>
    ${document.getElementById('qNotes').value?`<p style="margin-top:10px;padding:8px;background:#fafafa;border-left:3px solid #0f6fb2;font-size:10px"><b>Notas:</b> ${esc(document.getElementById('qNotes').value)}</p>`:''}
    ${photosHtml}
  </div>`;
  window.print();
}
function renderDashboard(){
  document.getElementById('kQuotes').textContent=state.quotes.length;
  document.getElementById('kClients').textContent=state.clients.length;
  document.getElementById('kLast').textContent=state.quotes.length>0?state.quotes[state.quotes.length-1].folio:'-';
}
function renderHistory(){
  const term=(document.getElementById('historySearch')?.value||'').toLowerCase();
  const qs=state.quotes.filter(q=>(q.folio+' '+q.client).toLowerCase().includes(term));
  const html=qs.length?`<div class="table-wrap"><table class="table"><tr><th>Folio</th><th>Cliente</th><th>Tela</th><th>Color</th><th>Fecha</th><th>Acciones</th></tr>${qs.map(q=>`<tr><td>${q.folio}</td><td>${esc(q.client)}</td><td>${esc(q.fabric)}</td><td>${esc(q.color)}</td><td>${q.date}</td><td><button onclick="loadQuote('${q.id}')" style="padding:4px 8px;font-size:12px">Editar</button><button onclick="delQuote('${q.id}')" style="padding:4px 8px;font-size:12px;background:#fee;color:#c00">Borrar</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--muted)">Sin cotizaciones aún.</p>';
  document.getElementById('historyTable').innerHTML=html;
}
function loadQuote(id){
  const q=state.quotes.find(x=>x.id===id);
  if(!q)return;
  showView('new');
  document.getElementById('qClient').value=q.client;
  document.getElementById('qStyle').value=q.style||'';
  document.getElementById('qDate').value=q.date;
  document.getElementById('qFabric').value=q.fabric;
  fillColors();
  document.getElementById('qColor').value=q.color;
  document.getElementById('qQty').value=q.qty;
  document.getElementById('qPcsKg').value=q.pcsKg;
  document.getElementById('qFx').value=q.fx;
  document.getElementById('qLogx').value=q.logx;
  document.getElementById('qNotes').value=q.notes;
  quotePhotos=q.photos||[];
  renderPhotoPreview();
  calc();
}
function delQuote(id){
  if(confirm('¿Eliminar esta cotización?')){
    state.quotes=state.quotes.filter(x=>x.id!==id);
    saveState();
    renderHistory();
    toast('Cotización eliminada');
  }
}
function addClient(){
  const name=document.getElementById('cName').value.trim();
  if(!name)return toast('Escribe el nombre del cliente');
  state.clients.push({id:crypto.randomUUID(),name,contact:document.getElementById('cContact').value});
  saveState();
  toast('Cliente agregado ✓');
  document.getElementById('cName').value='';
  document.getElementById('cContact').value='';
  updateClientList();
  renderClients();
}
function updateClientList(){
  const d=document.getElementById('clientList');
  if(d)d.innerHTML=state.clients.map(c=>`<option value="${esc(c.name)}">`).join('');
}
function renderClients(){
  const html=state.clients.length?`<div class="table-wrap"><table class="table"><tr><th>Nombre</th><th>Contacto</th><th>Acciones</th></tr>${state.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.contact)}</td><td><button onclick="delClient('${c.id}')" style="padding:4px 8px;font-size:12px;background:#fee;color:#c00">Borrar</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--muted)">Sin clientes registrados.</p>';
  document.getElementById('clientsTable').innerHTML=html;
}
function delClient(id){
  if(confirm('¿Eliminar este cliente?')){
    state.clients=state.clients.filter(x=>x.id!==id);
    saveState();
    updateClientList();
    renderClients();
    toast('Cliente eliminado');
  }
}
function addBase(){
  const name=prompt('Nombre de la tela:');
  if(!name)return;
  state.base.push({name,colors:{}});
  saveState();
  fillFabric();
  toast('Tela agregada');
}
function renderBase(){
  const html=state.base.length?`<div class="table-wrap"><table class="table"><tr><th>Tela</th><th>Colores</th><th>Acciones</th></tr>${state.base.map(f=>`<tr><td>${esc(f.name)}</td><td>${Object.keys(f.colors).join(', ')||'-'}</td><td><button onclick="editFabric('${state.base.indexOf(f)}')" style="padding:4px 8px;font-size:12px">Editar</button><button onclick="delFabric('${state.base.indexOf(f)}')" style="padding:4px 8px;font-size:12px;background:#fee;color:#c00">Borrar</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--muted)">Sin telas en la base.</p>';
  document.getElementById('baseTable').innerHTML=html;
}
function editFabric(idx){
  const f=state.base[idx];
  if(!f)return;
  const colorName=prompt('Nombre del color:');
  if(!colorName)return;
  const hilo=prompt('Costo hilo:',f.colors[colorName]?.hilo||0);
  const tejido=prompt('Costo tejido:',f.colors[colorName]?.tejido||0);
  const acabado=prompt('Costo acabado:',f.colors[colorName]?.acabado||0);
  f.colors[colorName]={hilo:parseFloat(hilo)||0,tejido:parseFloat(tejido)||0,acabado:parseFloat(acabado)||0};
  saveState();
  fillColors();
  renderBase();
  toast('Tela actualizada');
}
function delFabric(idx){
  if(confirm('¿Eliminar esta tela?')){
    state.base.splice(idx,1);
    saveState();
    fillFabric();
    fillColors();
    renderBase();
    toast('Tela eliminada');
  }
}
function loadSettings(){
  document.getElementById('sWaste').value=state.settings.waste||2;
  document.getElementById('sComm').value=state.settings.comm||5;
  document.getElementById('sProfit').value=state.settings.profit||25;
  document.getElementById('sSyncUrl').value=state.settings.syncUrl||'';
}
function saveSettings(){
  state.settings.waste=parseFloat(document.getElementById('sWaste').value)||2;
  state.settings.comm=parseFloat(document.getElementById('sComm').value)||5;
  state.settings.profit=parseFloat(document.getElementById('sProfit').value)||25;
  state.settings.syncUrl=document.getElementById('sSyncUrl').value;
  saveState();
  applySettings();
  toast('Configuración guardada ✓');
  calc();
}
function applySettings(){
  // Aplicar configuraciones si es necesario
}
function showView(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(view).classList.add('active');
  document.getElementById('topTitle').textContent=view.charAt(0).toUpperCase()+view.slice(1);
  if(view==='dashboard')renderDashboard();
  if(view==='history')renderHistory();
  if(view==='clients')renderClients();
  if(view==='base')renderBase();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
function exportData(){
  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`cotizador-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Datos exportados ✓');
}
function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=evt=>{
      try{
        const imported=JSON.parse(evt.target.result);
        state=imported;
        saveState();
        location.reload();
        toast('Datos importados ✓');
      }catch(err){
        toast('Error al importar: '+err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function syncToCloud(){
  const syncUrl=state.settings?.syncUrl;
  if(!syncUrl){
    toast('Configura la URL de sincronización en Configuración');
    showView('settings');
    return;
  }
  const syncId=localStorage.getItem(SYNC_KEY)||crypto.randomUUID();
  localStorage.setItem(SYNC_KEY,syncId);
  fetch(syncUrl,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({syncId,data:state,timestamp:new Date().toISOString()})
  }).then(r=>{
    if(r.ok){
      toast('Sincronizado con el servidor ✓');
    }else{
      toast('Error al sincronizar: '+r.statusText);
    }
  }).catch(e=>{
    toast('Error de conexión: '+e.message);
  });
}
function tryAutoSync(){
  const syncUrl=state.settings?.syncUrl;
  if(!syncUrl)return;
  const lastSync=parseInt(localStorage.getItem('lastSync')||0);
  if(Date.now()-lastSync>300000){
    const syncId=localStorage.getItem(SYNC_KEY)||crypto.randomUUID();
    localStorage.setItem(SYNC_KEY,syncId);
    fetch(syncUrl,{
      method:'GET',
      headers:{'X-Sync-ID':syncId}
    }).then(r=>r.json()).then(data=>{
      if(data&&data.data){
        state=data.data;
        saveState();
        localStorage.setItem('lastSync',Date.now());
      }
    }).catch(e=>console.error('Sync error:',e));
  }
}
window.addEventListener('load',init);
</script></body></html>
